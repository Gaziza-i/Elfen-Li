<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — Dell Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div data-header=""></div>

  <section class="auth">
    <aside class="auth__aside">
      <span class="watermark">join us</span>
      <span class="eyebrow">Dell Store</span>
      <h2>Последние новости, произошедшие с нами</h2>
      <p>Узнай о последних новостях и интересных акциях, которые мы делаем специально для Вас!</p>
    </aside>

    <div class="auth__panel">
      <form class="auth__form form-light" data-form="register">
        <h1>Зарегистрируйтесь</h1>
        <p class="muted">Создайте аккаунт за минуту.</p>

        <div class="field"><label>Ваше имя</label><input type="text" placeholder="Введите имя" required /></div>
        <div class="field"><label>E-mail</label><input type="email" placeholder="you@example.com" required /></div>
        <div class="field"><label>Пароль</label><input type="password" placeholder="Придумайте пароль" required /></div>

        <button type="submit" class="btn btn--reverse" style="margin-top:6px"><span class="btn__label">Зарегистрироваться</span><span class="btn__icon">&rarr;</span></button>

        <p class="auth__switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      </form>
    </div>
  </section>

  <div data-footer></div>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
